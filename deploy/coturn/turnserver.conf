# coturn: the call relay for Sondage interviews.
#
# When two homes can't connect directly (very common), the interview call goes
# through this server. It only forwards encrypted packets: it cannot see or hear
# the call, and it stores nothing. Run it on a small server with a public IP.
#
# The Rails app makes short-lived passwords with the same secret:
#   TURN_URLS=turn:relay.example.org:3478?transport=udp,turn:relay.example.org:3478?transport=tcp,turns:relay.example.org:5349?transport=tcp
#   TURN_SECRET=<the same value as static-auth-secret below>

listening-port=3478
tls-listening-port=5349
# external-ip=203.0.113.10        # the server's public IP, if it is behind NAT (most clouds)
realm=relay.example.org
server-name=relay.example.org

use-auth-secret
static-auth-secret=CHANGE-ME-to-a-long-random-string

# TLS on 5349 gets through strict firewalls (it looks like ordinary web traffic).
cert=/etc/letsencrypt/live/relay.example.org/fullchain.pem
pkey=/etc/letsencrypt/live/relay.example.org/privkey.pem

fingerprint
no-cli
no-multicast-peers
# Never relay into private networks (protects the server's own network).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# Relay ports (open these in the firewall, UDP)
min-port=49152
max-port=65535
# A video interview uses roughly 2-4 Mbit/s each way.
total-quota=200
stale-nonce=600
log-file=stdout
simple-log
